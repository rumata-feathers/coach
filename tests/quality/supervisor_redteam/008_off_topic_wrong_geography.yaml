response_text: |
  The San Francisco Bay Area remains the premier destination for CS graduates
  globally. Companies like Google, Meta, Apple, and Stripe all have their
  headquarters in the Bay Area, and the starting salaries for new graduates
  range from $120k to $180k. The key hubs are San Francisco, Mountain View,
  and Menlo Park. Visa sponsorship (H-1B) is the main challenge for
  international graduates.

