response_text: |
  This is a genuine tradeoff and the right answer depends on what you
  want from your career. Given your interest in research, a PhD offers
  structured depth in a narrow area — you'd spend 3-4 years becoming
  a genuine expert. The main downside is compensation (stipends are
  typically £17-20k vs £60-80k for ML engineers at good companies).

  The industry path gets you applying ML in real products faster, with
  better pay and typically broader exposure across the ML stack. Top-tier
  ML roles at Google, DeepMind, and similar require PhDs for research
  positions, but engineering roles don't.

  With a CS degree from Edinburgh and your research interest, you'd be
  a competitive PhD applicant. I'd suggest applying to 3-4 strong groups
  while also pursuing industry internships — that gives you real data on
  which you prefer.

