user_message: "How do I negotiate my salary for my first job offer?"
specific_ask: "How do I negotiate my salary for my first job offer?"
user_facts:
  age: 22
  degree: "Law, UCL"
  location: "London"

response_text: |
  Negotiating your first salary is worth doing — most employers expect it
  and it rarely backfires if done professionally. For a law graduate in
  London, a few practical points:

  First, research the market rate before the call. For newly qualified
  solicitors or paralegals in London, use the Law Society salary surveys
  and Glassdoor to anchor your ask. Magic Circle firms have fixed NQ
  salaries, but most other firms have flexibility of 5-15%.

  When you make the ask: be specific ("I was hoping for £X based on my
  research and the role scope"), positive ("I'm very excited about this
  offer"), and brief. Don't over-explain. If they push back, ask whether
  there's flexibility on the signing bonus or review timeline instead.

  One thing that trips people up: asking too soon. Wait until you have
  a written offer, not a verbal one.

