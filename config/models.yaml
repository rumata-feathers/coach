# Per-agent LLM configuration.
#
# Smart agents  → deepseek-ai/DeepSeek-V4-Flash
#   284B total / 13B active MoE, 1M context window, MIT license.
#   Three thinking modes (all produce <think>…</think> blocks which
#   huggingface.py strips unconditionally):
#     non-think : no extra_body; temperature unconstrained; fast & cheap
#     think     : extra_body.thinking_mode = "thinking"; temperature MUST be 1.0
#     think-max : extra_body.thinking_mode = "thinking" + reasoning_effort = "max";
#                 temperature MUST be 1.0; requires ≥384K context budget
#   Recommended: top_p=1.0 with thinking enabled (defaults are fine here).
#
# Utility agents → XiaomiMiMo/MiMo-V2-Flash
#   309B total / 15B active MoE, 256K context, MIT license.
#   Thinking disabled via chat_template_kwargs.enable_thinking=false for
#   speed and cost. Returns reasoning_content when enabled (separate field,
#   not in content), so enable_thinking=true requires client changes.

# ── Utility agents (MiMo-V2-Flash, thinking off) ─────────────────────────────

understander:
  provider: huggingface
  model: XiaomiMiMo/MiMo-V2-Flash
  temperature: 0.2
  max_tokens: 1500
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

critic:
  provider: huggingface
  model: XiaomiMiMo/MiMo-V2-Flash
  temperature: 0.0
  max_tokens: 1200
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

profiler:
  provider: huggingface
  model: XiaomiMiMo/MiMo-V2-Flash
  temperature: 0.1
  max_tokens: 1500
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

researcher_planner:
  provider: huggingface
  model: XiaomiMiMo/MiMo-V2-Flash
  temperature: 0.1
  max_tokens: 1500
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

supervisor:
  provider: huggingface
  model: XiaomiMiMo/MiMo-V2-Flash
  temperature: 0.0
  max_tokens: 400
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

# ── Smart agents (DeepSeek-V4-Flash) ─────────────────────────────────────────

# onboarder — conversational Q&A, no deep reasoning needed; non-think mode.
onboarder:
  provider: huggingface
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 0.7
  max_tokens: 2000

# coach — user-facing final response; think mode for quality.
# DeepSeek sometimes writes the JSON answer inside <think> and leaves nothing
# after </think> when response_format=json_object is active. The HuggingFace
# adapter handles this with a backward-scanning rescue heuristic.
coach:
  provider: huggingface
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 1.0
  max_tokens: 2500
  extra_body:
    thinking_mode: thinking

# researcher — multi-source synthesis with citations; think mode.
researcher:
  provider: huggingface
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 1.0
  max_tokens: 3000
  extra_body:
    thinking_mode: thinking

# devils_advocate — counter-argument generation; think mode.
devils_advocate:
  provider: huggingface
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 1.0
  max_tokens: 1500
  extra_body:
    thinking_mode: thinking

# synthesizer — integrates researcher + coach outputs; think mode.
synthesizer:
  provider: huggingface
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 1.0
  max_tokens: 3000
  extra_body:
    thinking_mode: thinking
