# Per-agent LLM configuration.
#
# Every agent reads its model + provider from this file. To swap providers for
# an agent, change only the `provider` and `model` keys — no agent code changes
# required.
#
# Model IDs verified via https://docs.claude.com/en/docs/about-claude/models
# (Claude Sonnet 4.6, Claude Haiku 4.5 — current as of 2026-04).

understander:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  temperature: 0.2
  max_tokens: 1500

coach:
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 0.7
  max_tokens: 2500

critic:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 1200

profiler:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  temperature: 0.1
  max_tokens: 1500

# ----------------------------------------------------------------------------
# Alternate provider examples — flip `provider` and `model` to use them.
#
# huggingface (OpenAI-compatible endpoint). Free/open models work; some require
# a pro plan. Uses HUGGINGFACE_API_TOKEN from the environment.
#
# understander:
#   provider: huggingface
#   model: meta-llama/Llama-3.1-8B-Instruct
#   temperature: 0.2
#   max_tokens: 1500
# ----------------------------------------------------------------------------
