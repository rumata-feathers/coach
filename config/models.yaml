# Per-agent LLM configuration.
#
# All agents use HuggingFace Inference Providers router.
# Qwen3 thinking blocks are stripped in the HuggingFace adapter
# (huggingface.py) if they appear in the response.
#
# Model tiers:
#   coach / onboarder — Qwen3-235B-A22B (MoE, 22B active params, best quality)
#   others            — Qwen3-32B  (dense, great instruction-following, cheaper)

understander:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.2
  max_tokens: 1500

coach:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2500

critic:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.0
  max_tokens: 1200

profiler:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.1
  max_tokens: 1500

onboarder:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2000
