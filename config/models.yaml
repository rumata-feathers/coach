# Per-agent LLM configuration.
#
# All agents use HuggingFace Inference Providers router.
# HuggingFaceClient automatically strips <think>...</think> blocks emitted by
# Qwen3 models, so no extra_body is needed here.
#
# Model tiers:
#   coach    — Qwen3-235B-A22B (MoE, 22B active params, best quality)
#   others   — Qwen3-32B  (dense, great instruction-following, cheaper)

understander:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.2
  max_tokens: 1500

coach:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2500

critic:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.0
  max_tokens: 1200

profiler:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.1
  max_tokens: 1500
