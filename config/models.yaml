# Per-agent LLM configuration.
#
# All agents use HuggingFace Inference Providers router.
#
# Thinking blocks: Qwen3 models emit <think>…</think> blocks by default.
# Neither "thinking: false" (Alibaba-specific) nor
# "chat_template_kwargs: {enable_thinking: false}" (vLLM-level) is
# forwarded by the HF Inference Providers router — both cause 400 errors
# regardless of the underlying backend (Novita/Together/etc.).
# huggingface.py strips <think>…</think> blocks unconditionally; that is
# the only reliable suppression mechanism available here.
#
# Model tiers:
#   coach / onboarder — Qwen3-235B-A22B (MoE, 22B active params, best quality)
#   others            — Qwen3-32B  (dense, great instruction-following, cheaper)

understander:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.2
  max_tokens: 1500

coach:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2500

critic:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.0
  max_tokens: 1200

profiler:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.1
  max_tokens: 1500

onboarder:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2000

# Researcher — synthesis call: Coach-tier, strong reasoning, lower temperature
# so citations are not hallucinated.
researcher:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.2
  max_tokens: 3000

# Researcher planner — cheap Haiku-tier call to decide what to search for.
# Uses the dense 32B model since the task is structured and doesn't require
# the full MoE.
researcher_planner:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.1
  max_tokens: 800

# Devil's Advocate — Coach-tier per spec §8.
# Haiku-tier produces generic risk-list slop; strong model needed for
# user-profile-grounded counter-points.
devils_advocate:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.3
  max_tokens: 1500

# Synthesizer — Coach-tier. This is the user-facing voice on Flow C; quality
# must match the Coach. Temperature 0.5 to produce coherent integrated prose
# without being too conservative.
synthesizer:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.5
  max_tokens: 3000
