# Per-agent LLM configuration.
#
# All agents use HuggingFace Inference Providers router.
# extra_body disables Qwen3 thinking blocks so JSON agents never get
# an empty response after <think>...</think> stripping.
#
# Model tiers:
#   coach    — Qwen3-235B-A22B (MoE, 22B active params, best quality)
#   others   — Qwen3-32B  (dense, great instruction-following, cheaper)

understander:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.2
  max_tokens: 1500
  extra_body:
    thinking: false

coach:
  provider: huggingface
  model: Qwen/Qwen3-235B-A22B
  temperature: 0.7
  max_tokens: 2500
  extra_body:
    thinking: false

critic:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.0
  max_tokens: 1200
  extra_body:
    thinking: false

profiler:
  provider: huggingface
  model: Qwen/Qwen3-32B
  temperature: 0.1
  max_tokens: 1500
  extra_body:
    thinking: false
