<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Coach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f7f7f8;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --coach-bg: #f3f4f6;
      --coach-text: #1a1a1a;
      --radius: 16px;
    }

    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; }
    .screen.active { display: flex; }

    /* ── Onboarding ── */
    .onboard-card {
      width: 100%; max-width: 420px;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
    }
    .onboard-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
    .onboard-card p  { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; line-height: 1.5; }
    .onboard-card input {
      width: 100%; padding: 12px 16px;
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 1rem; outline: none;
      transition: border-color 0.15s;
    }
    .onboard-card input:focus { border-color: var(--accent); }
    .onboard-card button {
      width: 100%; margin-top: 12px;
      padding: 12px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .onboard-card button:hover:not(:disabled) { background: var(--accent-hover); }
    .onboard-card button:disabled { opacity: 0.5; cursor: default; }
    .error-msg { margin-top: 10px; color: #dc2626; font-size: 0.85rem; }

    /* ── Chat screen ── */
    #chat-screen {
      display: none; flex-direction: column;
      height: 100%; width: 100%; max-width: 720px;
      margin: 0 auto; padding: 0;
    }
    #chat-screen.active { display: flex; }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-header .title { font-weight: 700; font-size: 1rem; }
    .chat-header .meta  { font-size: 0.78rem; color: var(--muted); }
    .reset-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px;
      font-size: 0.78rem; color: var(--muted); cursor: pointer;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 20px 8px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; max-width: 85%; gap: 10px; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.coach { align-self: flex-start; }

    .msg .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
    }
    .msg.user  .avatar { background: var(--accent);     color: #fff; }
    .msg.coach .avatar { background: var(--coach-bg);   color: var(--muted); border: 1px solid var(--border); }

    .msg .bubble {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 0.94rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user  .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.coach .bubble { background: var(--coach-bg); color: var(--coach-text); border-bottom-left-radius: 4px; }

    .msg.typing .bubble { color: var(--muted); font-style: italic; }

    .input-row {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row textarea {
      flex: 1; resize: none; overflow: hidden;
      padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 0.94rem;
      font-family: inherit; line-height: 1.5;
      outline: none; max-height: 160px; min-height: 44px;
      transition: border-color 0.15s;
    }
    .input-row textarea:focus { border-color: var(--accent); }
    .input-row button {
      padding: 10px 18px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      flex-shrink: 0; height: 44px;
      transition: background 0.15s;
    }
    .input-row button:hover:not(:disabled) { background: var(--accent-hover); }
    .input-row button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<!-- Onboarding -->
<div id="onboard-screen" class="screen">
  <div class="onboard-card">
    <h1>Career Coach</h1>
    <p>A personalised coach that thinks deeply about your situation.<br>Enter your name to get started.</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="100" autocomplete="off" />
    <button id="start-btn">Start coaching</button>
    <div id="onboard-error" class="error-msg"></div>
  </div>
</div>

<!-- Chat -->
<div id="chat-screen" class="screen">
  <div class="chat-header">
    <div>
      <div class="title">Career Coach</div>
      <div class="meta" id="user-label"></div>
    </div>
    <button class="reset-btn" id="reset-btn">Change name</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const API = '';  // same origin

// ── State ──────────────────────────────────────────────────────────────────
let userId    = localStorage.getItem('cc_user_id')    || null;
let sessionId = localStorage.getItem('cc_session_id') || null;
let userName  = localStorage.getItem('cc_user_name')  || null;
let sending   = false;

// ── Init ───────────────────────────────────────────────────────────────────
if (userId) {
  showChat();
} else {
  document.getElementById('onboard-screen').classList.add('active');
  document.getElementById('name-input').focus();
}

// ── Onboarding ─────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', register);
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') register();
});

async function register() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) return;
  const btn = document.getElementById('start-btn');
  const err = document.getElementById('onboard-error');
  btn.disabled = true; btn.textContent = 'Creating account…';
  err.textContent = '';
  try {
    const res = await fetch(`${API}/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ display_name: name }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    userId   = data.user_id;
    userName = name;
    localStorage.setItem('cc_user_id',   userId);
    localStorage.setItem('cc_user_name', userName);
    showChat();
  } catch (e) {
    err.textContent = 'Could not create account. Try again.';
    btn.disabled = false; btn.textContent = 'Start coaching';
  }
}

// ── Chat ───────────────────────────────────────────────────────────────────
function showChat() {
  document.getElementById('onboard-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');
  document.getElementById('user-label').textContent = userName || '';
  document.getElementById('msg-input').focus();
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Auto-grow textarea
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

document.getElementById('reset-btn').addEventListener('click', () => {
  localStorage.clear();
  location.reload();
});

async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  const typing = addMessage('coach', 'Thinking…', true);
  sending = true;
  document.getElementById('send-btn').disabled = true;

  try {
    const body = { user_id: userId, message: text };
    if (sessionId) body.session_id = sessionId;

    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    typing.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err?.detail?.message || err?.detail || `Error ${res.status}`;
      addMessage('coach', `Sorry, something went wrong: ${msg}`);
    } else {
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('cc_session_id', sessionId);
      addMessage('coach', data.response);
    }
  } catch (e) {
    typing.remove();
    addMessage('coach', 'Network error — please try again.');
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

function addMessage(role, text, isTyping = false) {
  const msgs = document.getElementById('messages');
  const initials = role === 'user'
    ? (userName || 'U').slice(0, 1).toUpperCase()
    : 'CC';

  const div = document.createElement('div');
  div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
  div.innerHTML = `
    <div class="avatar">${initials}</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
