repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/career_coach/
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-pyyaml>=6.0
